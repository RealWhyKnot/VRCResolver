name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: cargo build + test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PowerShell and release scripts
        shell: pwsh
        run: |
          ./.github/scripts/Test-WorkflowSyntax.ps1
          ./.github/scripts/Test-NightlyBetaPlan.ps1
          ./.github/scripts/Test-UpdateChangelog.ps1
          ./.github/scripts/Test-GenerateReleaseNotes.ps1

      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint and format check
        shell: pwsh
        run: ./scripts/lint.ps1

      - name: Test
        run: cargo test --workspace --locked

      - name: Release build
        shell: pwsh
        run: ./build.ps1 -SkipZip
