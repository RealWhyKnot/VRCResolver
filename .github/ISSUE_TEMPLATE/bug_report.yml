name: Bug report
description: A video didn't play, or VRCResolver misbehaved
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: VRCResolver version
      description: Right-click vrcresolver.exe, open Properties, then Details, and copy the file version.
      placeholder: "2026.11.23.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: what-failed
    attributes:
      label: What failed
      description: The video link that didn't play and the world you were in. Say whether it also fails with VRChat's stock yt-dlp.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: The lines around the failure, copied exactly. Logs are in `%USERPROFILE%\AppData\LocalLow\vrcresolver\logs\`.
      render: text
