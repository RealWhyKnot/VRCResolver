name: Question / help
description: Setup help, "is this a bug or am I holding it wrong?", or anything you'd ask in chat.
title: "[question] "
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Welcome. Questions are issues here. Don't worry about filing one for something that turns out to be obvious. If it leads to a doc fix or a real bug we'll relabel.

        **Read first:**
        - [README](https://github.com/RealWhyKnot/VRCResolver/blob/main/README.md): install / build / first-run.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to figure out, set up, or understand?
      placeholder: "I want to use vrcresolver with a custom VRChat install path. The Settings -> Advanced field exists but I'm not sure how it interacts with the patcher. Does it auto-detect changes if I move VRChat?"
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: |
        Helps us not retread ground. "Nothing yet" is fine, but if you've checked the README / settings / logs, say what you saw.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: vrcresolver version
      description: From the **About** panel or `dist/version.txt`.
      placeholder: "2026.4.27.7-4974"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, log snippets, the part of the README that confused you, etc. Optional.
    validations:
      required: false
