[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
vrcr-shared = { path = "crates/vrcr-shared" }

base64 = "0.23.1"
hex = "0.4"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "net", "time", "io-util", "process", "macros", "sync"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation"] }
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"
