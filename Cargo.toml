[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
vrcr-shared = { path = "crates/vrcr-shared" }

base64 = "0.23.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4"
memchr = "2"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
proptest = "1.12.0"
regex-lite = "0.1.9"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rmpv = "1.3.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "net", "time", "io-util", "process", "macros", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
x509-parser = "0.18.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation"] }
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"
